[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "machine-sentinel"
version = "0.1.0"
description = "Feature extraction and model training for an edge vibration monitor"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
]

[tool.setuptools.packages.find]
where = ["src"]
